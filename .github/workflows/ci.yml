name: ledger

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: gradle/actions/wrapper-validation@v4
      - name: Format check, unit tests, Postgres integration tests, artifact
        run: ./gradlew spotlessCheck test integrationTest build
      - name: Compose validation
        # Fresh checkouts have no .env (gitignored); validate against the documented example so
        # a newly required variable fails here until .env.example names it too.
        run: cp .env.example .env && docker compose config --quiet
      - name: Integrity audit script syntax
        run: for s in scripts/*.sh; do bash -n "$s"; done

  crash:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      # Same fresh-checkout problem as compose validation: the harness sources .env.
      - name: Crash-test environment
        run: cp .env.example .env
      - name: Isolated SIGKILL harness
        run: ./scripts/crash-recovery.sh
