name: ledger

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: gradle/actions/wrapper-validation@v4
      - name: Format check, unit tests, Postgres integration tests, artifact
        run: ./gradlew spotlessCheck test integrationTest build
      - name: Compose validation
        run: docker compose config --quiet
      - name: Integrity audit script syntax
        run: bash -n scripts/verify.sh && bash -n scripts/demo.sh && bash -n scripts/crash-recovery.sh

  crash:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Isolated SIGKILL harness
        run: ./scripts/crash-recovery.sh
