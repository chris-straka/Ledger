spring:
  application:
    name: ledger
  datasource:
    url: ${LEDGER_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/ledger}
    username: ${LEDGER_DB_USER:ledger_app}
    password: ${LEDGER_DB_PASSWORD:ledger_app_dev_only}
    hikari:
      maximum-pool-size: 10
  # Migrations run as ledger_owner in the one-shot Compose `migrate` service.
  # The app holds only ledger_app credentials, so it must never migrate —
  # Flyway auto-configuration would attempt DDL as the runtime role and fail.
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
