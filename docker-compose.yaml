# Ledger local runtime. One Postgres primary is the source of truth; one app.
# Ports bind to 127.0.0.1 (development only). No secrets are committed here:
# owner/app passwords come from .env (see .env.example).
#
# Service order: postgres -> migrate (one-shot, owner creds) -> ledger-api (app creds).
# The application container never receives owner credentials.

name: ledger

services:
  postgres:
    image: postgres:18.6
    ports:
      - "127.0.0.1:${LEDGER_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      POSTGRES_USER: ${POSTGRES_OWNER:-ledger_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env}
      LEDGER_APP: ${POSTGRES_APP:-ledger_app}
      LEDGER_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set in .env}
    volumes:
      # PG18+ images expect the mount at /var/lib/postgresql (versioned data
      # dir underneath); mounting .../data directly fails fast on startup.
      - ledger-postgres:/var/lib/postgresql
      # Fresh-cluster role bootstrap only. Schema and grants are Flyway-owned (Phase 2).
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER:-ledger_owner} -d ${POSTGRES_DB:-ledger}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot migration: the Flyway SQL in src/main/resources/db/migration,
  # run as ledger_owner. The app never receives these credentials and has
  # Flyway disabled (see application.yaml).
  migrate:
    image: flyway/flyway:13.5.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledger}
      -user=${POSTGRES_OWNER:-ledger_owner}
      -password=${POSTGRES_OWNER_PASSWORD:?set in .env}
      -connectRetries=10
      migrate
    deploy:
      restart_policy:
        condition: none

  ledger-api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LEDGER_API_PORT:-8080}:8080"
    environment:
      LEDGER_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledger}
      LEDGER_DB_USER: ${POSTGRES_APP:-ledger_app}
      LEDGER_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?set in .env}
      # Empty in production; the crash harness sets LEDGER_PROFILES=crash-test
      # to arm the profile-gated pause points (never exposed otherwise).
      SPRING_PROFILES_ACTIVE: ${LEDGER_PROFILES:-}
    healthcheck:
      # Liveness only. Readiness (DB + schema version) is the app's /actuator/health/readiness.
      test: ["CMD-SHELL", "java -version > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional local observability: `docker compose --profile observability up`.
  # Prometheus scrapes the ledger API; Grafana provisions one dashboard.
  # Thresholds are engineering defaults until a load test calibrates them.
  prometheus:
    image: prom/prometheus:v3.3.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      ledger-api:
        condition: service_started

  grafana:
    image: grafana/grafana:12.0.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ledger-grafana:/var/lib/grafana
    depends_on:
      - prometheus

  # Optional operator tooling: `docker compose --profile tools up pgadmin`
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ledger@example.local
      PGADMIN_DEFAULT_PASSWORD: ledger_dev_only
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./pgadmin/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ledger-pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # Named volumes persist the ledger and tool state across restarts.
  # `make clean` removes them explicitly; nothing else does.
  ledger-postgres:
  ledger-pgadmin:
  ledger-grafana:
